<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https://worldengine.space; style-src 'self'; script-src 'self'; connect-src 'none'"><title>WorldEngine.space</title><link rel="stylesheet" href="client.css"><script src="client.js" defer></script></head><body>
<svg class="symbol-library" aria-hidden="true"><defs>
<symbol id="i-library" viewBox="0 0 24 24"><path d="M3 3h7v7H3zm11 0h7v7h-7zM3 14h7v7H3zm11 0h7v7h-7z"/></symbol>
<symbol id="i-recent" viewBox="0 0 24 24"><path d="M3 11a9 9 0 1 1 2 7M3 4v7h7M12 7v6l4 2"/></symbol>
<symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/></symbol>
<symbol id="i-wishlist" viewBox="0 0 24 24"><path d="m12 2 3 7 7 1-5 5 1 7-6-4-6 4 1-7-5-5 7-1z"/></symbol>
<symbol id="i-account" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 22v-3a8 8 0 0 1 16 0v3"/></symbol>
<symbol id="i-fullscreen" viewBox="0 0 24 24"><path d="M3 9V3h6m6 0h6v6M3 15v6h6m6 0h6v-6"/></symbol>
<symbol id="i-play" viewBox="0 0 24 24"><path d="m6 3 15 9-15 9z"/></symbol>
<symbol id="i-world" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><ellipse cx="12" cy="12" rx="4" ry="10"/><path d="M2 12h20"/></symbol>
</defs></svg>
<header><img src="icon.png" alt=""><strong>WORLD ENGINE<span>.space</span></strong><span id="window-title">Library</span><span class="spacer"></span><button id="community-general" class="community-toggle" aria-expanded="false" title="General chat">Chat</button><button id="community-feed" class="community-toggle" aria-expanded="false" title="Community feed">Feed</button><span id="connection">Connecting</span><button id="fullscreen" title="Fullscreen" aria-label="Fullscreen"><svg><use href="#i-fullscreen"/></svg></button></header>
<aside aria-label="Client navigation"><button class="nav selected" data-page="library" title="Library" aria-label="Library"><svg><use href="#i-library"/></svg><span>Library</span></button><button class="nav" data-page="recent" title="Recently played" aria-label="Recently played"><svg><use href="#i-recent"/></svg><span>Recent</span></button><button class="nav" data-page="downloads" title="Downloads" aria-label="Downloads"><svg><use href="#i-download"/></svg><span>Downloads</span><small id="download-count"></small></button><button class="nav" data-page="wishlist" title="Wishlist" aria-label="Wishlist"><svg><use href="#i-wishlist"/></svg><span>Wishlist</span></button><div class="divider"></div><button id="resume" title="Resume game" aria-label="Resume game" hidden><svg><use href="#i-play"/></svg><span>Resume</span></button><span id="no-game" hidden></span><div class="spacer"></div><button id="account" class="nav" title="Account" aria-label="Account"><svg><use href="#i-account"/></svg><span id="account-name">Sign in</span></button><button id="website" title="Website" aria-label="Website"><svg><use href="#i-world"/></svg></button></aside>
<main id="library"><div class="page-heading"><div><h1 id="heading">Library</h1><p id="summary"></p></div><label class="search"><span>⌕</span><input id="search" placeholder="Search" aria-label="Find a game"></label></div>
<section id="detail" hidden><canvas id="starfield" aria-hidden="true"></canvas><div class="orbit" aria-hidden="true"><svg viewBox="0 0 800 500"><ellipse cx="510" cy="240" rx="275" ry="195"/><ellipse cx="510" cy="240" rx="315" ry="225"/><path d="M195 240h630M510 15v450"/><circle cx="510" cy="15" r="3"/><circle cx="825" cy="240" r="3"/></svg></div><div class="detail-copy"><div class="game-index"><span id="sequence">01</span><span class="index-line"></span><span id="genre"></span></div><h2 id="title"></h2><p id="description"></p><div class="detail-actions"><button id="play" class="primary">PLAY <span>↗</span></button><button id="download" title="Download standalone edition" aria-label="Download standalone edition"><svg><use href="#i-download"/></svg></button><small id="download-size"></small></div><small id="controls"></small></div><div class="art-window"><img id="detail-art" alt=""><span class="art-corner top-left"></span><span class="art-corner bottom-right"></span></div><div class="hero-bottom"><span></span><span id="edition">RECOMPILED</span></div></section>
<div class="collection-heading"><span>ALL GAMES</span><span class="keyboard-hint">← → SELECT <b>↵</b> PLAY</span></div><div id="cards" class="cards"></div></main>
<main id="downloads" hidden><div class="page-heading"><div><h1>Downloads</h1><p>Standalone editions</p></div><button id="open-downloads">Open folder ↗</button></div><div id="download-list"></div><p id="downloads-empty">No downloads yet.</p></main>
<div id="status" role="status" hidden></div><div id="launch-effect" aria-hidden="true"><span></span></div>
</body></html>
