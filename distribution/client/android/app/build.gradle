plugins { id 'com.android.application' }
android {
 namespace 'space.worldengine.client'
 compileSdk { version = release(37) }
 defaultConfig { applicationId 'space.worldengine.client'; minSdk 26; targetSdk 36; versionCode 1; versionName '1.0.0' }
 signingConfigs { release { storeFile file(System.getenv('WE_ANDROID_KEYSTORE'));storePassword System.getenv('WE_ANDROID_STORE_PASSWORD');keyAlias 'worldengine';keyPassword System.getenv('WE_ANDROID_STORE_PASSWORD') } }
 buildTypes { release { signingConfig signingConfigs.release } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17;targetCompatibility JavaVersion.VERSION_17 }
}
