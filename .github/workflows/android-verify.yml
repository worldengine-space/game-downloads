name: Verify Android downloads
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release containing APKs
        default: v2026.09.15
        required: true
permissions:
  # GitHub requires push access to read draft release assets.
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install websocket-client
      - name: Download signed APKs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release download "$RELEASE_TAG" --pattern '*-android.apk' --dir apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify offline Android games
        uses: reactivecircus/android-emulator-runner@v2.35.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 distribution/android/verify-device.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-evidence
          path: android-evidence/
